s://replicate.com","cat":"tool"},{"name":"Groq","url":"https://groq.com","cat":"tool"},{"name":"Ollama","url":"https://ollama.com","cat":"tool"},{"name":"LM Studio","url":"https://lmstudio.ai","cat":"tool"},{"name":"Jan","url":"https://jan.ai","cat":"tool"},{"name":"Cursor Directory","url":"https://cursor.directory","cat":"tool"},{"name":"DigitalPlat","url":"https://domain.digitalplat.org","cat":"tool"},{"name":"DNSHE","url":"https://www.dnshe.com","cat":"tool"},{"name":"pp.ua","url":"https://nic.ua","cat":"tool"},{"name":"isroot.in","url":"https://isroot.in","cat":"tool"},{"name":"deSEC","url":"https://desec.io","cat":"tool"},{"name":"ClouDNS","url":"https://www.cloudns.net","cat":"tool"},{"name":"DeepSeek","url":"https://chat.deepseek.com","cat":"local"},{"name":"通义千问 Qwen","url":"https://chat.qwen.ai","cat":"local"},{"name":"Kimi","url":"https://www.kimi.com","cat":"local"},{"name":"智谱 ChatGLM","url":"https://chatglm.cn","cat":"local"},{"name":"Z.ai","url":"https://chat.z.ai","cat":"local"},{"name":"豆包","url":"https://www.doubao.com","cat":"local"},{"name":"腾讯元宝","url":"https://yuanbao.tencent.com","cat":"local"},{"name":"MiniMax","url":"https://www.minimaxi.com","cat":"local"},{"name":"ModelScope 魔搭","url":"https://www.modelscope.cn","cat":"local"},{"name":"硅基流动","url":"https://siliconflow.cn","cat":"local"},{"name":"扣子 Coze","url":"https://www.coze.cn","cat":"local"},{"name":"知乎","url":"https://www.zhihu.com","cat":"local"},{"name":"AIHOT","url":"https://aihot.news/all","cat":"nav"},{"name":"365AI 导航","url":"https://365dh.cn","cat":"nav"},{"name":"AI 导航台","url":"https://nav-ai.cn","cat":"nav"},{"name":"AI 聚途","url":"https://aijutu.com","cat":"nav"},{"name":"ZhiNav","url":"https://zhinav.com","cat":"nav"},{"name":"AI 全站导航","url":"https://ainall.cc","cat":"nav"},{"name":"AI Stack Nav","url":"https://aistacknav.com","cat":"nav"}];
const rows = document.getElementById("rows");
const stat = document.getElementById("stat");
const out = document.getElementById("out");
const copyBtn = document.getElementById("copy");
let results = {};

function hostOf(u){ return u.replace(/^https?:\/\//,"").split("/")[0]; }

// 探针一：fetch(no-cors) —— 能到达网络层就 resolve，硬失败才是 reject
async function probeFetch(url, timeoutMs = 8000){
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), timeoutMs);
    await fetch(url, { mode: "no-cors", signal: ctrl.signal, redirect: "follow" });
    clearTimeout(to);
    return "ok";
  } catch (e) {
    return e.name === "AbortError" ? "timeout" : "blocked";
  }
}

// 探针二：本站 /favicon.ico —— 不依赖任何第三方（Google favicon 在国内被墙）
function probeIcon(url, timeoutMs = 8000){
  return new Promise(resolve => {
    const img = new Image();
    let done = false;
    const t = setTimeout(() => { if(!done){ done = true; img.src=""; resolve("timeout"); } }, timeoutMs);
    img.onload  = () => { if(!done){ done = true; clearTimeout(t); resolve("ok"); } };
    img.onerror = () => { if(!done){ done = true; clearTimeout(t); resolve("bad"); } };
    img.src = url.replace(/\/+$/,"") + "/favicon.ico";
  });
}

// 两者都失败才算「疑似不可达」；只要有一个通过就算可达 —— 减少误报
async function probeBoth(url){
  const a = await probeFetch(url);
  if (a === "ok") return "ok";
  const b = await probeIcon(url);
  if (b === "ok") return "ok";
  return a === "timeout" || b === "timeout" ? "timeout" : "blocked";
}

rows.innerHTML = SITES.map((s,i) => `<tr id="r${i}">
  <td>${s.name}</td><td><code>${hostOf(s.url)}</code></td><td class="cell">待测</td></tr>`).join("");

document.getElementById("run").onclick = async () => {
  const btn = document.getElementById("run");
  btn.disabled = true;
  results = {};
  let ok=0, bad=0, to=0;

  for (let i=0; i<SITES.length; i++){
    const s = SITES[i];
    const cell = document.querySelector(`#r${i} .cell`);
    cell.textContent = "…"; cell.className = "cell s-wait";

    let r = await probeBoth(s.url);

    results[s.name] = { url: s.url, cat: s.cat, r };
    if (r === "ok"){ ok++; cell.textContent="通"; cell.className="cell s-ok"; }
    else if (r === "blocked"){ bad++; cell.textContent="疑似被拦"; cell.className="cell s-bad";
      document.getElementById("r"+i).classList.add("bad-row"); }
    else { to++; cell.textContent="超时"; cell.className="cell s-wait";
      document.getElementById("r"+i).classList.add("bad-row"); }

    stat.textContent = `进度 ${i+1}/${SITES.length}　通 ${ok}　疑似被拦 ${bad}　超时 ${to}`;
  }

  btn.disabled = false;
  copyBtn.disabled = false;
  const badList = Object.entries(results).filter(([,v]) => v.r!=="ok")
    .map(([k,v]) => `${k}\t${v.url}\t${v.r==="timeout"?"超时":"疑似被拦"}`).join("\n");
  out.value =
    `连通性粗测结果（只判硬失败，不代表可用性）\n生成时间：${new Date().toLocaleString()}\n` +
    `总计 ${SITES.length}　通 ${ok}　疑似被拦 ${bad}　超时 ${to}\n\n` +
    `【疑似被拦 / 超时清单】\n${badList || "（无）"}\n`;
};

copyBtn.onclick = () => {
  out.select();
  navigator.clipboard.writeText(out.value).then(
    () => { copyBtn.textContent = "已复制 ✓"; setTimeout(()=>copyBtn.textContent="复制结果", 1500); },
    () => { copyBtn.textContent = "请手动复制"; }
  );
};
